global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'veramo-agent'
    static_configs:
      - targets: ['veramo-agent:3001']

  - job_name: 'issuer-service'
    static_configs:
      - targets: ['issuer-service:3002']

  - job_name: 'verifier-service'
    static_configs:
      - targets: ['verifier-service:3003']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3004']

  - job_name: 'revocation-service'
    static_configs:
      - targets: ['revocation-service:3005']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
