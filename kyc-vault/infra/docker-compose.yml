services:
  # Database layer
  postgres:
    image: postgres:16-alpine
    container_name: kyc-vault-postgres
    environment:
      POSTGRES_USER: kyc-admin
      POSTGRES_PASSWORD: kyc-secure-password
      POSTGRES_DB: kyc-vault
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc-admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kyc-network

  redis:
    image: redis:7-alpine
    container_name: kyc-vault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - kyc-network

  # Core services
  veramo-agent:
    build:
      context: ../
      dockerfile: services/veramo-agent/Dockerfile
    container_name: kyc-vault-veramo-agent
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kyc-admin
      DB_PASSWORD: kyc-secure-password
      DB_NAME: kyc-vault
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kyc-network

  issuer-service:
    build:
      context: ../
      dockerfile: services/issuer-service/Dockerfile
    container_name: kyc-vault-issuer-service
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kyc-admin
      DB_PASSWORD: kyc-secure-password
      DB_NAME: kyc-vault
      VERAMO_AGENT_URL: http://veramo-agent:3001
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      veramo-agent:
        condition: service_started
    networks:
      - kyc-network

  verifier-service:
    build:
      context: ../
      dockerfile: services/verifier-service/Dockerfile
    container_name: kyc-vault-verifier-service
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kyc-admin
      DB_PASSWORD: kyc-secure-password
      DB_NAME: kyc-vault
      VERAMO_AGENT_URL: http://veramo-agent:3001
      REVOCATION_SERVICE_URL: http://revocation-service:3005
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      veramo-agent:
        condition: service_started
    networks:
      - kyc-network

  notification-service:
    build:
      context: ../
      dockerfile: services/notification-service/Dockerfile
    container_name: kyc-vault-notification-service
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kyc-admin
      DB_PASSWORD: kyc-secure-password
      DB_NAME: kyc-vault
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kyc-network

  revocation-service:
    build:
      context: ../
      dockerfile: services/revocation-service/Dockerfile
    container_name: kyc-vault-revocation-service
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: development
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: kyc-admin
      DB_PASSWORD: kyc-secure-password
      DB_NAME: kyc-vault
      PORT: 3005
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kyc-network

  # Nginx reverse proxy for stable connectivity
  nginx:
    image: nginx:alpine
    container_name: kyc-vault-nginx
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - veramo-agent
    networks:
      - kyc-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend
  wallet-frontend:
    build:
      context: ../
      dockerfile: apps/wallet-frontend/Dockerfile
    container_name: kyc-vault-wallet-frontend
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
    environment:
      NODE_ENV: development
    depends_on:
      - veramo-agent
    networks:
      - kyc-network

  # Observability - temporarily disabled due to Docker registry issues
