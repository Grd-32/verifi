  #   networks:
  #     - kyc-network

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: kyc-vault-grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: admin
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
