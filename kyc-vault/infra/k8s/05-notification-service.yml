apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: kyc-vault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: kyc-vault/notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_NAME
          value: "notification-db"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: kyc-vault-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kyc-vault-secrets
              key: db-password
        - name: PORT
          value: "3004"
        resources:
          requests:
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: kyc-vault
spec:
  selector:
    app: notification-service
  ports:
  - protocol: TCP
    port: 3004
    targetPort: 3004
  type: ClusterIP
