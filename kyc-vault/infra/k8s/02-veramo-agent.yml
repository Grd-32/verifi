apiVersion: apps/v1
kind: Deployment
metadata:
  name: veramo-agent
  namespace: kyc-vault
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veramo-agent
  template:
    metadata:
      labels:
        app: veramo-agent
    spec:
      containers:
      - name: veramo-agent
        image: kyc-vault/veramo-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: kyc-vault-config
              key: node-env
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: kyc-vault-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kyc-vault-secrets
              key: db-password
        - name: PORT
          value: "3001"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: veramo-agent
  namespace: kyc-vault
spec:
  selector:
    app: veramo-agent
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: ClusterIP
